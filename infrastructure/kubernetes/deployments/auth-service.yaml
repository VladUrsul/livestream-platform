apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: streamr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: do-registry
      containers:
      - name: auth-service
        image: registry.digitalocean.com/streamr-registry/auth-service:latest
        ports:
        - containerPort: 8081
        env:
        # Database
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_NAME
        - name: DB_SSLMODE
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_SSLMODE
        # Redis
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: REDIS_PASSWORD
        # RabbitMQ
        - name: RABBITMQ_HOST
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: RABBITMQ_PORT
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: RABBITMQ_PASSWORD
        # JWT
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: JWT_REFRESH_SECRET
        # ConfigMap
        envFrom:
        - configMapRef:
            name: streamr-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: streamr
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081
    targetPort: 8081