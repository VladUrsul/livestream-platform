apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: streamr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-service
  template:
    metadata:
      labels:
        app: stream-service
    spec:
      imagePullSecrets:
        - name: do-registry
      containers:
      - name: stream-service
        image: registry.digitalocean.com/streamr-registry/app:stream-service
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 1935
          name: rtmp
        env:
        - name: SERVER_PORT
          value: "8083"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_PORT
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_NAME
        - name: DB_SSLMODE
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: DB_SSLMODE
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: REDIS_PASSWORD
        # RabbitMQ
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: RABBITMQ_URL
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: streamr-secrets
              key: JWT_ACCESS_SECRET
        envFrom:
        - configMapRef:
            name: streamr-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stream-service
  namespace: streamr
spec:
  selector:
    app: stream-service
  ports:
  - name: http
    port: 8083
    targetPort: 8083
  - name: rtmp
    port: 1935
    targetPort: 1935
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rtmp-loadbalancer
  namespace: streamr
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: stream-service
  ports:
  - name: rtmp
    port: 1935
    targetPort: 1935
    protocol: TCP