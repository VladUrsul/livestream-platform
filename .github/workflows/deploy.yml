name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: registry.digitalocean.com/streamr-registry

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - user-service
          - stream-service
          - chat-service
          - notification-service
          - api-gateway
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Log in to DigitalOcean Registry
        run: |
          echo "${{ secrets.DO_TOKEN }}" | docker login registry.digitalocean.com -u doctl --password-stdin

      - name: Build and push Docker image
        run: |
          # Determine build context
          CONTEXT="./services/${{ matrix.service }}"
          if [ "${{ matrix.service }}" = "frontend" ]; then
            CONTEXT="./frontend"
          fi

          IMAGE=$REGISTRY/app:${{ matrix.service }}

          # Build and push
          docker build -t $IMAGE $CONTEXT
          docker push $IMAGE

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DigitalOcean Registry
        run: |
          echo "${{ secrets.DO_TOKEN }}" | docker login registry.digitalocean.com -u doctl --password-stdin

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save streamr-cluster

      - name: Deploy to Kubernetes
        run: |
          # Apply namespaces & configmaps first
          kubectl apply -f infrastructure/kubernetes/namespace.yaml
          kubectl apply -f infrastructure/kubernetes/configmaps/
          kubectl apply -f infrastructure/kubernetes/rabbitmq/

          # Deploy all services
          kubectl apply -f infrastructure/kubernetes/deployments/
          kubectl apply -f infrastructure/kubernetes/frontend/
          kubectl apply -f infrastructure/kubernetes/ingress/

          # Restart deployments to pick up new images
          kubectl rollout restart deployment -n streamr