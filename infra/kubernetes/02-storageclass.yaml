---
# Storage Class for databases and stateful services
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: livestream-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
parameters:
  replication-type: none

---
# Local storage for minikube/single-node testing (comment out for cloud)
# For production, use cloud provider storage classes (EBS, GCE Persistent Disks, Azure Disks, etc.)
