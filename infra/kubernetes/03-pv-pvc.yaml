---
# PersistentVolumeClaims for Auth Database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-db-pvc
  namespace: livestream
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: livestream-storage
  resources:
    requests:
      storage: 10Gi
  volumeName: auth-db-pv

