---
# PersistentVolumes for databases
apiVersion: v1
kind: PersistentVolume
metadata:
  name: auth-db-pv
  namespace: livestream
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: livestream-storage
  hostPath:
    path: /mnt/livestream/auth-db
    type: DirectoryOrCreate

