---
# HorizontalPodAutoscaler for Stream Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stream-service-hpa
  namespace: livestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stream-service
  # HLS output is written to a local filesystem path (/tmp/hls).
  # Without a shared volume, running multiple replicas causes
  # manifests/segments to be generated in one pod while requests hit another.
  # Keep to 1 replica until a shared HLS storage is implemented.
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

