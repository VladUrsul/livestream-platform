---
# Ingress Controller Namespace (NGINX)
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx

---
# Ingress for API Gateway with SSL/TLS support
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livestream-ingress
  namespace: livestream
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - livestream.example.com
    - api.livestream.example.com
    secretName: livestream-tls
  rules:
  - host: livestream.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: api.livestream.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080

---
# Ingress for RabbitMQ Management UI
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-ingress
  namespace: livestream
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "rabbitmq-basic-auth"
    nginx.ingress.kubernetes.io/auth-realm: "RabbitMQ Management"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - rabbitmq.livestream.example.com
    secretName: rabbitmq-tls
  rules:
  - host: rabbitmq.livestream.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rabbitmq-management
            port:
              number: 15672

---
# NetworkPolicy for Auth Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-network-policy
  namespace: livestream
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: livestream
    ports:
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: livestream
  - to:
    - podSelector:
        matchLabels:
          app: auth-db
  - to:
    - podSelector:
        matchLabels:
          app: redis
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq
  - ports:
    - protocol: TCP
      port: 53
  - ports:
    - protocol: UDP
      port: 53

