---
# Stream Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: livestream
  labels:
    app: stream-service
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: stream-service
  template:
    metadata:
      labels:
        app: stream-service
        version: v1
    spec:
      serviceAccountName: app-service-account
      containers:
      - name: stream-service
        image: livestream-platform-stream-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 1935
          name: rtmp
        envFrom:
        - configMapRef:
            name: stream-service-config
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: stream-db-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: stream-db-secret
              key: password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: stream-db-secret
              key: database
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: password
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: access-secret
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: url
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

---
# Stream Service HTTP Service
apiVersion: v1
kind: Service
metadata:
  name: stream-service
  namespace: livestream
  labels:
    app: stream-service
spec:
  type: ClusterIP
  selector:
    app: stream-service
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http

---
# Stream Service RTMP Service (LoadBalancer for external RTMP)
apiVersion: v1
kind: Service
metadata:
  name: stream-service-rtmp
  namespace: livestream
  labels:
    app: stream-service
spec:
  type: LoadBalancer
  selector:
    app: stream-service
  ports:
  - port: 1935
    targetPort: 1935
    protocol: TCP
    name: rtmp

