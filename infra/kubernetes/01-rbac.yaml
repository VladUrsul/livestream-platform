---
# Service Account for applications
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: livestream

---
# ClusterRole for pod communication and security
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: livestream-app-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding to bind the role to service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: livestream-app-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: livestream-app-role
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: livestream
